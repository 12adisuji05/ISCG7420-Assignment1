{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card-soft form-card p-4 p-md-5">
            <h1 class="page-title h3 mb-4 text-center">Welcome back</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100 py-2">Login</button>
            </form>
            <p class="text-center small mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
