{% extends 'base.html' %}

{% block title %}Book Appointment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card-soft form-card p-4 p-md-5">
            <h1 class="page-title h3 mb-4"><i class="bi bi-calendar-plus text-danger"></i> Book Appointment</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-coral w-100 py-2">Book</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
