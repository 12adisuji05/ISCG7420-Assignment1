{% extends 'base.html' %}

{% block title %}Cancel Appointment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card-soft p-4 p-md-5 text-center">
            <i class="bi bi-exclamation-triangle-fill text-warning display-4"></i>
            <h1 class="page-title h3 mt-3">Cancel Appointment</h1>
            <p class="text-muted">Are you sure you want to cancel your appointment with {{ object.slot.doctor }} on {{ object.slot.date|date:"j F Y" }}?</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger">Yes, cancel</button>
                <a href="{% url 'my-appointments' %}" class="btn btn-outline-secondary">No</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
