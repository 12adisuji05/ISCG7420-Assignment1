{% extends 'base.html' %}

{% block title %}Delete{% endblock %}

{% block content %}
<h1>Are you sure?</h1>
<p>Delete: {{ object }}</p>

    <a href="{% url 'dashboard' %}" class="btn btn-secondary">No</a>
</form>
{% endblock %}
