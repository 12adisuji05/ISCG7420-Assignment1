{% extends 'base.html' %}

{% block title %}Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card-soft p-4 p-md-5 text-center">
            <i class="bi bi-exclamation-triangle-fill text-warning display-4"></i>
            <h1 class="page-title h3 mt-3">Are you sure?</h1>
            <p class="text-muted">Delete: {{ object }}</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">No</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
