{% extends 'base.html' %}

{% block title %}Doctors{% endblock %}

{% block content %}
<h1>Doctors</h1>
<a href="{% url 'add-doctor' %}" class="btn btn-primary mb-3">Add Doctor</a>
<table class="table">
    <tr><th>Name</th><th>Specialisation</th><th></th></tr>
    {% for doctor in object_list %}
        <tr>
            <td>{{ doctor }}</td>
            <td>{{ doctor.specialisation }}</td>
            <td>
                <a href="{% url 'update-doctor' doctor.pk %}" class="btn btn-secondary btn-sm">Edit</a>
                <a href="{% url 'delete-doctor' doctor.pk %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">No doctors yet.</td></tr>
    {% endfor %}
</table>
<a href="{% url 'dashboard' %}">Back to dashboard</a>
{% endblock %}
