{% extends 'base.html' %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card-soft form-card p-4 p-md-5">
            <h1 class="page-title h3 mb-4">{% if object %}Edit{% else %}Add{% endif %}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100 py-2">Save</button>
            </form>
            <a href="{% url 'dashboard' %}" class="d-block text-center mt-3">Back to dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
