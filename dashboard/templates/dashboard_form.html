{% extends 'base.html' %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
</form>
<a href="{% url 'dashboard' %}">Back to dashboard</a>
{% endblock %}
