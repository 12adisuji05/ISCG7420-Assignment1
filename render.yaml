# Based on https://render.com/docs/deploy-django
databases:
  - name: pikiora-db
    plan: free

services:
  - type: web
    name: pikiora-clinic
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn pikiora.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: pikiora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@pikiora.co.nz
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
